# Builds the game and publishes it to GitLab Pages on every push to the default branch.
image: node:22
pages:
  script:
    - npm ci
    - npm test
    - npm run build
    - rm -rf public && mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
